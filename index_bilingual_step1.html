<style>
/* ============================================
   CSS Variables & Reset
   ============================================ */
:root {
  --color-primary: #1a1a2e;
  --color-primary-dark: #0f0f1e;
  --color-secondary: #16213e;
  --color-gold: #c9a96e;
  --color-gold-light: #d4af37;
  --color-gold-dark: #a8894a;
  --color-white: #ffffff;
  --color-off-white: #f5f5f5;
  --color-light-gray: #e8e8e8;
  --color-mid-gray: #999999;
  --color-dark-gray: #333333;
  --color-text: #2c2c2c;
  --color-text-light: #666666;
  --font-title: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --transition-fast: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-medium: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.16);
  --shadow-gold: 0 4px 20px rgba(201,169,110,0.3);
  --max-width: 1200px;
  --nav-height: 80px;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text);
  background: var(--color-white);
  line-height: 1.7;
  overflow-x: hidden;
}

/* ============================================
   Utility Classes
   ============================================ */
.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 40px;
}

.section-padding {
  padding: 120px 0;
}

.section-title {
  font-family: var(--font-title);
  font-size: 2.4rem;
  color: var(--color-primary);
  text-align: center;
  margin-bottom: 16px;
  letter-spacing: 4px;
  position: relative;
}

.section-subtitle {
  font-family: var(--font-title);
  font-size: 1rem;
  color: var(--color-gold);
  text-align: center;
  margin-bottom: 60px;
  letter-spacing: 6px;
  text-transform: uppercase;
}

.section-divider {
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
  margin: 20px auto 50px;
}

.gold-line {
  display: block;
  width: 40px;
  height: 2px;
  background: var(--color-gold);
  margin: 12px auto 0;
}

/* Scroll Animation */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity var(--transition-medium), transform var(--transition-medium);
}

.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}

.reveal-left {
  opacity: 0;
  transform: translateX(-60px);
  transition: opacity var(--transition-medium), transform var(--transition-medium);
}

.reveal-left.revealed {
  opacity: 1;
  transform: translateX(0);
}

.reveal-right {
  opacity: 0;
  transform: translateX(60px);
  transition: opacity var(--transition-medium), transform var(--transition-medium);
}

.reveal-right.revealed {
  opacity: 1;
  transform: translateX(0);
}

.reveal-scale {
  opacity: 0;
  transform: scale(0.9);
  transition: opacity var(--transition-medium), transform var(--transition-medium);
}

.reveal-scale.revealed {
  opacity: 1;
  transform: scale(1);
}

/* ============================================
   Navigation
   ============================================ */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--nav-height);
  z-index: 1000;
  transition: all var(--transition-fast);
  background: transparent;
}

.navbar.scrolled {
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  height: 64px;
}

.navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--color-white);
}

.nav-brand-icon {
  width: 42px;
  height: 42px;
  border: 2px solid var(--color-gold);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.nav-brand-icon::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--color-gold);
  border-radius: 2px;
}

.nav-brand-icon::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  background: var(--color-gold);
  border-radius: 50%;
}

.nav-brand-text {
  display: flex;
  flex-direction: column;
}

.nav-brand-name {
  font-family: var(--font-title);
  font-size: 1.2rem;
  letter-spacing: 4px;
  line-height: 1.3;
}

.nav-brand-en {
  font-size: 0.6rem;
  letter-spacing: 3px;
  color: var(--color-gold);
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 36px;
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  color: rgba(255,255,255,0.85);
  font-size: 0.9rem;
  letter-spacing: 2px;
  position: relative;
  transition: color var(--transition-fast);
  padding: 4px 0;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--color-gold);
  transition: width var(--transition-fast);
}

.nav-links a:hover {
  color: var(--color-gold);
}

.nav-links a:hover::after {
  width: 100%;
}

.nav-phone {
  color: var(--color-gold);
  font-size: 0.85rem;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-phone::before {
  content: '';
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--color-gold);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: inline-block;
}

/* Mobile Menu */
.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 8px;
  z-index: 1001;
}

.nav-toggle span {
  width: 24px;
  height: 2px;
  background: var(--color-white);
  transition: all var(--transition-fast);
}

.nav-toggle.active span:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}

.nav-toggle.active span:nth-child(2) {
  opacity: 0;
}

.nav-toggle.active span:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}

/* ============================================
   Hero Section
   ============================================ */
.hero {
  position: relative;
  height: 100vh;
  min-height: 700px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--color-primary);
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* CSS gradient simulating a luxury window view */
.hero-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(22, 33, 62, 0.9) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 50%, rgba(26, 26, 46, 0.9) 0%, transparent 60%),
    linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 30%, #16213e 60%, #1a1a2e 100%);
}

/* Window frame effect */
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    /* Vertical mullion */
    linear-gradient(90deg, transparent 49.5%, rgba(201,169,110,0.08) 49.5%, rgba(201,169,110,0.08) 50.5%, transparent 50.5%),
    /* Horizontal mullion */
    linear-gradient(0deg, transparent 49.5%, rgba(201,169,110,0.08) 49.5%, rgba(201,169,110,0.08) 50.5%, transparent 50.5%),
    /* Frame border */
    linear-gradient(90deg, rgba(201,169,110,0.15), transparent 5%, transparent 95%, rgba(201,169,110,0.15)),
    linear-gradient(0deg, rgba(201,169,110,0.15), transparent 5%, transparent 95%, rgba(201,169,110,0.15));
  opacity: 0.6;
}

/* Light rays from window */
.hero-light {
  position: absolute;
  top: -20%;
  right: 10%;
  width: 500px;
  height: 800px;
  background: radial-gradient(ellipse at center, rgba(201,169,110,0.06) 0%, transparent 70%);
  transform: rotate(-15deg);
  z-index: 2;
  animation: lightPulse 8s ease-in-out infinite;
}

@keyframes lightPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.hero-particles {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(201,169,110,0.3);
  border-radius: 50%;
  animation: particleFloat linear infinite;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
}

.hero-content {
  position: relative;
  z-index: 3;
  text-align: center;
  color: var(--color-white);
  max-width: 800px;
  padding: 0 40px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 24px;
  border: 1px solid rgba(201,169,110,0.3);
  border-radius: 30px;
  font-size: 0.8rem;
  letter-spacing: 4px;
  color: var(--color-gold);
  margin-bottom: 40px;
  backdrop-filter: blur(10px);
  background: rgba(201,169,110,0.05);
}

.hero-badge::before,
.hero-badge::after {
  content: '';
  width: 4px;
  height: 4px;
  background: var(--color-gold);
  border-radius: 50%;
}

.hero-title {
  font-family: var(--font-title);
  font-size: 3.8rem;
  letter-spacing: 12px;
  line-height: 1.3;
  margin-bottom: 12px;
  font-weight: 400;
}

.hero-title-gold {
  color: var(--color-gold);
}

.hero-slogan {
  font-family: var(--font-title);
  font-size: 1.3rem;
  letter-spacing: 10px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 50px;
  font-weight: 300;
}

.hero-cta {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 40px;
  background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
  color: var(--color-primary);
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 3px;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: all var(--transition-fast);
  font-weight: 600;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-gold);
}

.btn-outline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 40px;
  background: transparent;
  color: var(--color-white);
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 3px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 2px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.btn-outline:hover {
  border-color: var(--color-gold);
  color: var(--color-gold);
  transform: translateY(-2px);
}

.hero-scroll {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 0.7rem;
  letter-spacing: 3px;
  animation: scrollBounce 2s ease-in-out infinite;
  cursor: pointer;
  text-decoration: none;
}

.hero-scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, rgba(201,169,110,0.6), transparent);
}

@keyframes scrollBounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ============================================
   Core Features Bar
   ============================================ */
.features-bar {
  position: relative;
  z-index: 10;
  margin-top: -60px;
}

.features-bar .container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--color-white);
  box-shadow: var(--shadow-lg);
  border-radius: 2px;
  overflow: hidden;
}

.feature-item {
  padding: 40px 30px;
  text-align: center;
  border-right: 1px solid var(--color-light-gray);
  transition: all var(--transition-fast);
  position: relative;
}

.feature-item:last-child {
  border-right: none;
}

.feature-item:hover {
  background: var(--color-primary);
  color: var(--color-white);
}

.feature-item:hover .feature-icon {
  background: rgba(201,169,110,0.15);
  border-color: var(--color-gold);
}

.feature-item:hover .feature-icon svg {
  stroke: var(--color-gold);
}

.feature-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  border: 1.5px solid var(--color-light-gray);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.feature-icon svg {
  width: 24px;
  height: 24px;
  stroke: var(--color-primary);
  fill: none;
  stroke-width: 1.5;
  transition: stroke var(--transition-fast);
}

.feature-name {
  font-family: var(--font-title);
  font-size: 1.15rem;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.feature-desc {
  font-size: 0.85rem;
  color: var(--color-text-light);
  transition: color var(--transition-fast);
}

.feature-item:hover .feature-desc {
  color: rgba(255,255,255,0.7);
}

/* ============================================
   About / Brand Story Section
   ============================================ */
.about {
  background: var(--color-off-white);
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}

.about-visual {
  position: relative;
  aspect-ratio: 4/3;
  overflow: hidden;
}

.about-image {
  width: 100%;
  height: 100%;
  position: relative;
  background:
    linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
  border-radius: 2px;
  overflow: hidden;
}

/* Simulated factory/workshop image with CSS */
.about-image::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    /* Window grid pattern */
    repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(201,169,110,0.1) 80px, rgba(201,169,110,0.1) 82px),
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(201,169,110,0.1) 60px, rgba(201,169,110,0.1) 62px);
}

.about-image::after {
  content: '2006';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-title);
  font-size: 6rem;
  color: rgba(201,169,110,0.12);
  letter-spacing: 8px;
  font-weight: 300;
}

.about-image-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 30px;
  background: linear-gradient(to top, rgba(26,26,46,0.9), transparent);
  color: var(--color-white);
}

.about-image-overlay span {
  font-family: var(--font-title);
  font-size: 1rem;
  letter-spacing: 4px;
  color: var(--color-gold);
}

.about-frame {
  position: absolute;
  top: -15px;
  right: -15px;
  width: 100px;
  height: 100px;
  border-top: 2px solid var(--color-gold);
  border-right: 2px solid var(--color-gold);
}

.about-content {
  padding: 20px 0;
}

.about-label {
  font-size: 0.8rem;
  letter-spacing: 4px;
  color: var(--color-gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.about-heading {
  font-family: var(--font-title);
  font-size: 2rem;
  color: var(--color-primary);
  line-height: 1.5;
  margin-bottom: 24px;
  letter-spacing: 2px;
}

.about-text {
  font-size: 0.95rem;
  color: var(--color-text-light);
  line-height: 2;
  margin-bottom: 36px;
}

.about-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.stat-item {
  text-align: center;
  padding: 20px 10px;
  border: 1px solid var(--color-light-gray);
  border-radius: 2px;
  transition: all var(--transition-fast);
}

.stat-item:hover {
  border-color: var(--color-gold);
  background: rgba(201,169,110,0.03);
}

.stat-number {
  font-family: var(--font-title);
  font-size: 1.8rem;
  color: var(--color-gold);
  display: block;
  line-height: 1.2;
}

.stat-unit {
  font-size: 0.85rem;
  color: var(--color-gold);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--color-text-light);
  margin-top: 4px;
  letter-spacing: 1px;
}

/* ============================================
   Products Section
   ============================================ */
.products {
  background: var(--color-white);
  position: relative;
}

.products::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-light-gray), transparent);
}

.product-tabs {
  display: flex;

  gap: 8px;

}

  transition: all var(--transition-fast);

}

.product-tab:hover,

}

.product-series {

}

.product-series.active {

.series-header {
  text-align: center;
  margin-bottom: 50px;
}

.series-name {

  font-size: 1.6rem;
  color: var(--color-primary);

}

.product-grid {

.product-card {

}

}

.product-card-image {
  aspect-ratio: 4/3;
  position: relative;
  overflow: hidden;
}

/* Different gradient styles per series */
.product-card[data-series="glory"] .product-card-image {
  background: linear-gradient(135deg, #1a1a2e 0%, #2d2d4e 50%, #1a1a2e 100%);
}

.product-card[data-series="supreme"] .product-card-image {
  background: linear-gradient(135deg, #16213e 0%, #0f3460 50%, #16213e 100%);
}

.product-card[data-series="phantom"] .product-card-image {
  background: linear-gradient(135deg, #1a1a2e 0%, #2a2a4e 50%, #16213e 100%);
}

.product-card[data-series="earl"] .product-card-image {

<!-- ============================================
     JavaScript
     ============================================ -->
<script>
(function() {
  'use strict';

  // ---- Navbar scroll effect ----
  var navbar = document.getElementById('navbar');
  var backToTop = document.getElementById('backToTop');

  window.addEventListener('scroll', function() {
    var scrollY = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollY > 80) {
      navbar.classList.add('scrolled');
    } else {
      navbar.classList.remove('scrolled');
    }
    if (scrollY > 600) {
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  });

  // ---- Mobile Navigation ----
  window.toggleNav = function() {
    var navLinks = document.getElementById('navLinks');
    var navToggle = document.getElementById('navToggle');
    var navOverlay = document.getElementById('navOverlay');
    navLinks.classList.toggle('open');
    navToggle.classList.toggle('active');
    navOverlay.classList.toggle('open');
    document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
  };

  window.closeNav = function() {
    var navLinks = document.getElementById('navLinks');
    var navToggle = document.getElementById('navToggle');
    var navOverlay = document.getElementById('navOverlay');
    navLinks.classList.remove('open');
    navToggle.classList.remove('active');
    navOverlay.classList.remove('open');
    document.body.style.overflow = '';
  };

  // ---- Product Series Tabs ----
  window.switchSeries = function(seriesId, btn) {
    // Deactivate all
    var tabs = document.querySelectorAll('.product-tab');
    var series = document.querySelectorAll('.product-series');
    tabs.forEach(function(t) { t.classList.remove('active'); });
    series.forEach(function(s) { s.classList.remove('active'); });

    // Activate selected
    btn.classList.add('active');
    var target = document.getElementById('series-' + seriesId);
    if (target) {
      target.classList.add('active');
      // Re-trigger reveal animations for cards in this series
      var cards = target.querySelectorAll('.reveal');
      cards.forEach(function(card) {
        card.classList.remove('revealed');
        void card.offsetWidth; // force reflow
        card.classList.add('revealed');
      });
    }
  };

  // ---- Intersection Observer for Scroll Animations ----
  var observerOptions = {
    root: null,
    rootMargin: '0px 0px -60px 0px',
    threshold: 0.1
  };

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        // Don't unobserve so we can re-trigger if needed
      }
    });
  }, observerOptions);

  // Observe all reveal elements
  var revealElements = document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale');
  revealElements.forEach(function(el) {
    observer.observe(el);
  });

  // ---- Performance Ring Animation ----
  var ringObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        ringObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });

  var rings = document.querySelectorAll('.perf-ring');
  rings.forEach(function(ring) {
    ringObserver.observe(ring);
  });

  // ---- Count Up Animation ----
  var countObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var el = entry.target;
        var target = parseInt(el.getAttribute('data-target'), 10);
        var duration = 2000;
        var startTime = null;

        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = Math.min((timestamp - startTime) / duration, 1);
          // Ease out cubic
          var eased = 1 - Math.pow(1 - progress, 3);
          var current = Math.floor(eased * target);

          if (target >= 10000) {
            el.textContent = (current / 10000).toFixed(current >= target ? 0 : 0) + (current >= target ? '' : '');
            if (target === 50000) {
              el.textContent = Math.floor(current / 10000) + '万+';
            } else if (target === 300000) {
              el.textContent = Math.floor(current / 10000) + '万';
            }
          } else {
            el.textContent = current;
          }

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            if (target === 50000) el.textContent = '5万+';
            else if (target === 300000) el.textContent = '30万';
            else el.textContent = target;
          }
        }

        requestAnimationFrame(animate);
        countObserver.unobserve(el);
      }
    });
  }, { threshold: 0.5 });

  var countElements = document.querySelectorAll('.count-up');
  countElements.forEach(function(el) {
    countObserver.observe(el);
  });

  // ---- Hero Particles ----
  var particlesContainer = document.getElementById('particles');
  if (particlesContainer) {
    for (var i = 0; i < 30; i++) {
      var particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 12) + 's';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.width = (1 + Math.random() * 2) + 'px';
      particle.style.height = particle.style.width;
      particle.style.opacity = (0.2 + Math.random() * 0.4).toString();
      particlesContainer.appendChild(particle);
    }
  }

  // ---- Smooth scroll for anchor links ----
  document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
    anchor.addEventListener('click', function(e) {
      var targetId = this.getAttribute('href');
      if (targetId === '#') return;
      var targetEl = document.querySelector(targetId);
      if (targetEl) {
        e.preventDefault();
        var offset = navbar.offsetHeight;
        var targetPosition = targetEl.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
      }
    });
  });

})();
</script>
</body>
